<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ショートトラック ラップタイマー</title>
  <!-- Chart.js (グラフ描画) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2canvas (画像化ライブラリ) -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --btn-lap: #22c55e;
      --btn-lap-active: #16a34a;
      --btn-start: #3b82f6;
      --btn-stop: #ef4444;
      --btn-reset: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ヘッダー・過去記録ボタン */
    .top-header {
      background-color: var(--card-bg);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .app-title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .btn-history-toggle {
      background: #334155;
      color: #fff;
      border: 1px solid var(--accent-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
    }

    /* 設定・選手名バー */
    .setting-bar {
      padding: 10px 16px;
      background-color: #131d31;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .input-field, .distance-select {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--accent-color);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .runner-name-input {
      flex: 1;
      min-width: 140px;
    }

    .custom-input {
      width: 80px;
      text-align: center;
      display: none;
    }

    /* メインタイマー表示 */
    .main-display {
      background: linear-gradient(180deg, #0f172a 0%, #0b1329 100%);
      padding: 12px 16px;
      text-align: center;
      border-bottom: 1px solid #1e293b;
    }

    .laps-remaining-label {
      font-size: 0.75rem;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    .laps-remaining-value {
      font-size: 3.8rem;
      font-weight: 900;
      color: #f59e0b;
      line-height: 1;
      font-family: monospace;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }

    .total-time {
      font-size: 2.8rem;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: -1px;
      color: var(--text-main);
      margin-top: 4px;
    }

    .current-lap-time {
      font-size: 1.2rem;
      font-family: monospace;
      color: var(--accent-color);
      margin-top: -2px;
    }

    /* 操作ボタン */
    .action-area {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-lap {
      background-color: var(--btn-lap);
      color: #ffffff;
      border: none;
      border-radius: 16px;
      height: 110px;
      font-size: 2.2rem;
      font-weight: 900;
      box-shadow: 0 6px 18px rgba(34, 197, 94, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-lap:active {
      background-color: var(--btn-lap-active);
      transform: scale(0.98);
    }

    .btn-lap:disabled {
      background-color: #334155;
      color: #64748b;
      box-shadow: none;
    }

    .sub-controls {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 10px;
    }

    .btn-control {
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      cursor: pointer;
    }

    .btn-start { background-color: var(--btn-start); }
    .btn-stop { background-color: var(--btn-stop); }
    .btn-reset { background-color: var(--btn-reset); }

    /* メインエリア */
    .content-container {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: bold;
      margin-bottom: 12px;
      color: var(--accent-color);
    }

    .chart-container {
      position: relative;
      width: 100%;
      max-height: 220px;
    }

    /* ラップ履歴テーブル */
    .records-header, .record-item {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1.5fr;
      text-align: center;
      padding: 8px 0;
      font-family: monospace;
    }

    .records-header {
      font-size: 0.85rem;
      color: var(--text-sub);
      border-bottom: 1px solid #334155;
    }

    .record-item {
      border-bottom: 1px solid #1e293b;
      font-size: 1rem;
    }

    .fastest-lap { color: #4ade80; font-weight: bold; }
    .slowest-lap { color: #f87171; }

    /* モーダルウィンドウ */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--card-bg);
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
    }

    .btn-close {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    .history-simple-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .history-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .name-edit-input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 0.95rem;
      flex: 1;
    }

    .btn-icon-delete {
      background: none;
      border: none;
      color: #f87171;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }

    .btn-action {
      flex: 1;
      padding: 10px 6px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      color: white;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-pdf { background-color: #ea580c; }
    .btn-img { background-color: #0284c7; }
    .btn-clear-all { background-color: #dc2626; flex: 0.7; }

    /* スマホ画像保存モーダル */
    .img-preview-container {
      text-align: center;
    }

    .img-preview-container img {
      max-width: 100%;
      height: auto;
      border: 1px solid #334155;
      border-radius: 8px;
      margin-top: 10px;
      user-select: auto;
      -webkit-user-select: auto;
    }

    /* 出力用スタイル */
    .export-container {
      display: none;
      background: #ffffff;
      color: #000000;
      font-family: sans-serif;
      padding: 12px;
      box-sizing: border-box;
      width: 100%;
    }

    .export-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      align-items: start;
      width: 100%;
    }

    .export-card {
      border: 1px solid #000;
      border-radius: 4px;
      padding: 6px;
      box-sizing: border-box;
      background: #ffffff;
    }

    .export-card-title {
      font-weight: bold;
      font-size: 9pt;
      border-bottom: 1px solid #000;
      padding-bottom: 2px;
      margin-bottom: 2px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #000000;
    }

    .export-card-total {
      font-weight: bold;
      font-size: 8.5pt;
      border-bottom: 1px solid #000;
      padding-bottom: 2px;
      margin-bottom: 4px;
      text-align: center;
      color: #000000;
      font-family: monospace;
    }

    .export-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 8pt;
      background: #ffffff;
    }

    .export-table th, .export-table td {
      border-bottom: 1px dotted #aaa;
      text-align: center;
      padding: 2px 0;
      color: #000000;
    }

    .export-table th {
      font-weight: bold;
      border-bottom: 1px solid #000;
    }

    /* 印刷/PDF専用定義 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }

      html, body {
        background-color: #ffffff !important;
        color: #000000 !important;
        height: auto !important;
        overflow: visible !important;
      }

      .top-header, .setting-bar, .main-display, .action-area, .content-container, .modal-overlay {
        display: none !important;
      }

      .export-container {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body>

  <!-- トップバー -->
  <div class="top-header">
    <div class="app-title">ショートトラック タイマー</div>
    <button class="btn-history-toggle" id="openHistoryBtn">過去の記録 📁</button>
  </div>

  <!-- 設定・選手名バー -->
  <div class="setting-bar">
    <input type="text" id="runnerName" class="input-field runner-name-input" placeholder="選手名を入力 (例: 山田太郎)">
    <select id="distanceSelect" class="distance-select">
      <option value="4.5">500m (4.5周)</option>
      <option value="9" selected>1000m (9周)</option>
      <option value="13.5">1500m (13.5周)</option>
      <option value="27">3000m (27周)</option>
      <option value="custom">カスタム</option>
      <option value="0">フリー</option>
    </select>
    <input type="number" id="customLapsInput" class="input-field custom-input" placeholder="周数" step="0.5" value="5">
  </div>

  <!-- タイマー・残り周数 -->
  <div class="main-display">
    <div class="laps-remaining-label">LAPS REMAINING</div>
    <div id="lapsRemaining" class="laps-remaining-value">9.0</div>
    <div id="totalTimeDisplay" class="total-time">00:00.00</div>
    <div id="currentLapDisplay" class="current-lap-time">LAP: 00.00</div>
  </div>

  <!-- 操作ボタン -->
  <div class="action-area">
    <button id="lapBtn" class="btn-lap" disabled>LAP</button>
    <div class="sub-controls">
      <button id="startStopBtn" class="btn-control btn-start">START</button>
      <button id="resetBtn" class="btn-control btn-reset">保存 ＆ RESET</button>
    </div>
  </div>

  <div class="content-container">
    <!-- 現在のラップ表 -->
    <div class="card">
      <div class="card-title">現在のラップ記録</div>
      <div class="records-header">
        <span>残り周数</span>
        <span>ラップ</span>
        <span>トータル</span>
      </div>
      <div id="recordsList"></div>
    </div>

    <!-- 終了後のグラフ表示エリア -->
    <div id="chartCard" class="card" style="display: none;">
      <div class="card-title">ラップタイム推移グラフ</div>
      <div class="chart-container">
        <canvas id="lapChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 過去の記録モーダル -->
  <div id="historyModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color:#38bdf8;">過去の記録一覧</h3>
        <button class="btn-close" id="closeHistoryBtn">&times;</button>
      </div>
      <div style="font-size:0.8rem; color:var(--text-sub); margin-bottom:8px;">
        <label><input type="checkbox" id="selectAllCheckbox" checked> すべて選択</label>
      </div>
      <div id="modalHistoryList" class="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-action btn-pdf" id="exportSelectedPdfBtn">PDF出力</button>
        <button class="btn-action btn-img" id="exportSelectedImgBtn">画像出力</button>
        <button class="btn-action btn-clear-all" id="clearAllHistoryBtn">全削除</button>
      </div>
    </div>
  </div>

  <!-- 画像保存用プレビューモーダル（スマホ対応） -->
  <div id="imgPreviewModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h3 style="color:#38bdf8;">画像が生成されました</h3>
        <button class="btn-close" id="closeImgPreviewBtn">&times;</button>
      </div>
      <div class="modal-body img-preview-container">
        <p style="font-size:0.85rem; color:var(--text-sub);">画像を長押しして「写真に保存」または共有してください。</p>
        <div id="imgPreviewResult"></div>
      </div>
    </div>
  </div>

  <!-- 出力用レイアウトコンテナ -->
  <div id="exportArea" class="export-container"></div>

  <script>
    const STORAGE_KEY = 'shorttrack_lap_histories';

    let startTime = 0, elapsedTime = 0, timerInterval = null, isRunning = false;
    let lapStartTime = 0, totalLaps = 9.0, completedLaps = 0;
    let lapRecords = [];
    let savedHistories = [];
    let chartInstance = null;

    // DOM
    const runnerNameInput = document.getElementById('runnerName');
    const distanceSelect = document.getElementById('distanceSelect');
    const customLapsInput = document.getElementById('customLapsInput');
    const totalTimeDisplay = document.getElementById('totalTimeDisplay');
    const currentLapDisplay = document.getElementById('currentLapDisplay');
    const lapsRemainingDisplay = document.getElementById('lapsRemaining');
    const startStopBtn = document.getElementById('startStopBtn');
    const lapBtn = document.getElementById('lapBtn');
    const resetBtn = document.getElementById('resetBtn');
    const recordsList = document.getElementById('recordsList');
    const chartCard = document.getElementById('chartCard');

    const historyModal = document.getElementById('historyModal');
    const openHistoryBtn = document.getElementById('openHistoryBtn');
    const closeHistoryBtn = document.getElementById('closeHistoryBtn');
    const modalHistoryList = document.getElementById('modalHistoryList');
    const selectAllCheckbox = document.getElementById('selectAllCheckbox');
    const exportSelectedPdfBtn = document.getElementById('exportSelectedPdfBtn');
    const exportSelectedImgBtn = document.getElementById('exportSelectedImgBtn');
    const clearAllHistoryBtn = document.getElementById('clearAllHistoryBtn');
    const exportArea = document.getElementById('exportArea');

    const imgPreviewModal = document.getElementById('imgPreviewModal');
    const closeImgPreviewBtn = document.getElementById('closeImgPreviewBtn');
    const imgPreviewResult = document.getElementById('imgPreviewResult');

    // 初期化：ローカルストレージから履歴読み込み
    function loadSavedHistories() {
      try {
        const rawData = localStorage.getItem(STORAGE_KEY);
        if (rawData) {
          savedHistories = JSON.parse(rawData);
        }
      } catch (e) {
        console.error('Failed to load histories:', e);
      }
    }

    function saveHistoriesToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedHistories));
      } catch (e) {
        console.error('Failed to save histories:', e);
      }
    }

    loadSavedHistories();

    // モーダル開閉
    openHistoryBtn.addEventListener('click', () => {
      renderModalHistory();
      historyModal.style.display = 'flex';
    });
    closeHistoryBtn.addEventListener('click', () => { historyModal.style.display = 'none'; });
    closeImgPreviewBtn.addEventListener('click', () => { imgPreviewModal.style.display = 'none'; });

    // 距離切り替え
    distanceSelect.addEventListener('change', (e) => {
      if (e.target.value === 'custom') {
        customLapsInput.style.display = 'inline-block';
        totalLaps = parseFloat(customLapsInput.value) || 0;
      } else {
        customLapsInput.style.display = 'none';
        totalLaps = parseFloat(e.target.value);
      }
      updateLapsRemaining();
    });

    customLapsInput.addEventListener('input', (e) => {
      totalLaps = parseFloat(e.target.value) || 0;
      updateLapsRemaining();
    });

    function formatLaps(val) {
      return val % 1 === 0 ? val.toFixed(0) : val.toFixed(1);
    }

    function updateLapsRemaining() {
      if (totalLaps === 0) {
        lapsRemainingDisplay.textContent = '∞';
      } else {
        const remaining = Math.max(0, totalLaps - completedLaps);
        lapsRemainingDisplay.textContent = formatLaps(remaining);
      }
    }

    function formatTime(ms) {
      const m = Math.floor(ms / 60000);
      const s = Math.floor((ms % 60000) / 1000);
      const cs = Math.floor((ms % 1000) / 10);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    }

    function formatLapTime(ms) {
      const s = Math.floor(ms / 1000);
      const cs = Math.floor((ms % 1000) / 10);
      return `${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
    }

    // タイマー操作
    startStopBtn.addEventListener('click', () => {
      if (!isRunning) {
        if (totalLaps > 0 && completedLaps >= totalLaps) return;
        isRunning = true;
        startTime = Date.now() - elapsedTime;
        if (lapRecords.length === 0) {
          lapStartTime = startTime;
        } else {
          const sumTime = lapRecords.reduce((a, b) => a + b.lapTime, 0);
          lapStartTime = Date.now() - (elapsedTime - sumTime);
        }
        timerInterval = setInterval(updateTimer, 10);
        startStopBtn.textContent = 'STOP';
        startStopBtn.className = 'btn-control btn-stop';
        lapBtn.disabled = false;
        distanceSelect.disabled = true;
      } else {
        stopTimer();
      }
    });

    function stopTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      startStopBtn.textContent = 'START';
      startStopBtn.className = 'btn-control btn-start';
      lapBtn.disabled = true;
    }

    function updateTimer() {
      const now = Date.now();
      elapsedTime = now - startTime;
      const currentLapTime = now - lapStartTime;
      totalTimeDisplay.textContent = formatTime(elapsedTime);
      currentLapDisplay.textContent = `LAP: ${formatLapTime(currentLapTime)}`;
    }

    // ラップボタン押し下げ
    lapBtn.addEventListener('click', () => {
      if (!isRunning) return;

      const now = Date.now();
      const lapTime = now - lapStartTime;

      let lapDist = 1.0;
      if (lapRecords.length === 0 && (totalLaps % 1 === 0.5)) {
        lapDist = 0.5;
      }

      completedLaps += lapDist;
      const remaining = Math.max(0, totalLaps - completedLaps);

      lapRecords.push({
        remainingVal: remaining,
        lapTime: lapTime,
        accumTime: elapsedTime,
        isHalf: lapDist === 0.5
      });

      lapStartTime = now;
      renderRecords();
      updateLapsRemaining();

      if (totalLaps > 0 && completedLaps >= totalLaps) {
        stopTimer();
        currentLapDisplay.textContent = 'FINISH!';
        showChart();
      }
    });

    function renderRecords() {
      recordsList.innerHTML = '';
      const fullLaps = lapRecords.filter(r => !r.isHalf).map(r => r.lapTime);
      const minLap = fullLaps.length > 0 ? Math.min(...fullLaps) : null;
      const maxLap = fullLaps.length > 0 ? Math.max(...fullLaps) : null;

      lapRecords.forEach((r) => {
        const div = document.createElement('div');
        div.className = 'record-item';
        let lapClass = '';
        if (!r.isHalf && fullLaps.length > 1) {
          if (r.lapTime === minLap) lapClass = 'fastest-lap';
          else if (r.lapTime === maxLap) lapClass = 'slowest-lap';
        }
        div.innerHTML = `
          <span>${formatLaps(r.remainingVal)}</span>
          <span class="${lapClass}">${formatLapTime(r.lapTime)}</span>
          <span>${formatTime(r.accumTime)}</span>
        `;
        recordsList.insertBefore(div, recordsList.firstChild);
      });
    }

    function showChart() {
      chartCard.style.display = 'block';
      const ctx = document.getElementById('lapChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      const labels = lapRecords.map(r => `残り${formatLaps(r.remainingVal)}`);
      const data = lapRecords.map(r => (r.lapTime / 1000).toFixed(2));

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'ラップタイム (秒)',
            data: data,
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.2)',
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { title: { display: true, text: '秒' } } }
        }
      });
    }

    // 保存 ＆ リセット
    resetBtn.addEventListener('click', () => {
      if (lapRecords.length > 0) {
        const runnerName = runnerNameInput.value.trim() || '未設定の選手';
        savedHistories.unshift({
          id: Date.now(),
          name: runnerName,
          totalTime: formatTime(elapsedTime),
          records: [...lapRecords]
        });
        saveHistoriesToStorage(); // ストレージ保存
      }

      stopTimer();
      elapsedTime = 0;
      completedLaps = 0;
      lapRecords = [];
      totalTimeDisplay.textContent = '00:00.00';
      currentLapDisplay.textContent = 'LAP: 00.00';
      recordsList.innerHTML = '';
      chartCard.style.display = 'none';
      distanceSelect.disabled = false;
      updateLapsRemaining();
    });

    // モーダル描画
    function renderModalHistory() {
      modalHistoryList.innerHTML = '';
      if (savedHistories.length === 0) {
        modalHistoryList.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">保存された記録はありません</div>';
        return;
      }

      savedHistories.forEach((item) => {
        const div = document.createElement('div');
        div.className = 'history-simple-item';
        div.innerHTML = `
          <input type="checkbox" class="history-checkbox" data-id="${item.id}" checked>
          <input type="text" class="name-edit-input" value="${item.name}" onchange="updateHistoryName(${item.id}, this.value)">
          <button class="btn-icon-delete" onclick="deleteHistory(${item.id})">✕</button>
        `;
        modalHistoryList.appendChild(div);
      });
    }

    selectAllCheckbox.addEventListener('change', (e) => {
      const checkboxes = document.querySelectorAll('.history-checkbox');
      checkboxes.forEach(cb => cb.checked = e.target.checked);
    });

    window.updateHistoryName = function(id, newName) {
      const item = savedHistories.find(h => h.id === id);
      if (item) {
        item.name = newName;
        saveHistoriesToStorage(); // 名前編集時にも保存
      }
    };

    window.deleteHistory = function(id) {
      savedHistories = savedHistories.filter(h => h.id !== id);
      saveHistoriesToStorage(); // 削除時にも保存
      renderModalHistory();
    };

    clearAllHistoryBtn.addEventListener('click', () => {
      if (savedHistories.length === 0) return;
      if (confirm('すべての履歴を削除してもよろしいですか？')) {
        savedHistories = [];
        saveHistoriesToStorage();
        renderModalHistory();
      }
    });

    // 出力用HTML構築
    function generateExportHTML() {
      const selectedIds = Array.from(document.querySelectorAll('.history-checkbox:checked')).map(cb => parseInt(cb.dataset.id));
      const selectedHistories = savedHistories
        .filter(h => selectedIds.includes(h.id))
        .sort((a, b) => a.id - b.id);

      if (selectedHistories.length === 0) return null;

      let html = '<div class="export-grid">';
      selectedHistories.forEach(item => {
        html += `
          <div class="export-card">
            <div class="export-card-title">${item.name}</div>
            <div class="export-card-total">タイム: ${item.totalTime}</div>
            <table class="export-table">
              <thead>
                <tr>
                  <th>残り周数</th>
                  <th>ラップ</th>
                </tr>
              </thead>
              <tbody>
                ${item.records.map(r => `
                  <tr>
                    <td>${formatLaps(r.remainingVal)}</td>
                    <td>${formatLapTime(r.lapTime)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    // PDF（印刷）出力
    exportSelectedPdfBtn.addEventListener('click', () => {
      const html = generateExportHTML();
      if (!html) {
        alert('出力する記録を選択してください');
        return;
      }
      
      exportArea.removeAttribute('style');
      exportArea.innerHTML = html;
      
      setTimeout(() => {
        window.print();
      }, 50);
    });

    // 画像（PNG）出力
    exportSelectedImgBtn.addEventListener('click', () => {
      const html = generateExportHTML();
      if (!html) {
        alert('出力する記録を選択してください');
        return;
      }

      exportArea.innerHTML = html;
      exportArea.style.display = "block";
      exportArea.style.position = "fixed";
      exportArea.style.left = "0px";
      exportArea.style.top = "0px";
      exportArea.style.zIndex = "-9999";
      exportArea.style.width = "800px";

      setTimeout(() => {
        html2canvas(exportArea, {
          backgroundColor: "#ffffff",
          scale: 2
        }).then(canvas => {
          exportArea.removeAttribute('style');
          const imgData = canvas.toDataURL('image/png');

          const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

          if (isMobile) {
            imgPreviewResult.innerHTML = `<img src="${imgData}" alt="ラップ記録">`;
            historyModal.style.display = 'none';
            imgPreviewModal.style.display = 'flex';
          } else {
            const link = document.createElement('a');
            link.download = 'ショートトラック_ラップ記録_一括.png';
            link.href = imgData;
            link.click();
          }
        }).catch(() => {
          exportArea.removeAttribute('style');
        });
      }, 50);
    });
  </script>
</body>
</html>
